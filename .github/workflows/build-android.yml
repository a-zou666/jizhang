name: Build Android App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Static checks (syntax + smoke test)
        run: npm run check

      - name: Initialize Android project
        run: npm run tauri android init

      # 麦克风权限必须在清单里声明，否则 Android 会直接拒绝录音请求
      # （用户看不到授权弹窗，WebView 把 getUserMedia 判为 NotAllowedError）
      - name: Inject microphone permission into AndroidManifest
        run: node scripts/inject-android-permissions.mjs

      # 再校验一遍：权限确实已声明，且排在 <application> 之前
      - name: Verify microphone permission
        run: |
          node scripts/inject-android-permissions.mjs --check
          grep -n "uses-permission" src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # 只打手机真正需要的两种 ABI（x86 / x86_64 是模拟器用的，白占 16MB），
      # 并按 ABI 拆包，这样 arm64 手机只下 9MB 左右的那一个
      - name: Build APK per ABI
        run: npm run tauri android build -- --apk --split-per-abi --target aarch64 armv7

      # Tauri 生成的 app/build.gradle.kts 里没有 signingConfigs，release 变体没有签名配置，
      # 所以上面这一步只会产出 app-<abi>-release-unsigned.apk。
      # 这里用仓库 Secrets 里的 upload keystore 对产物签名（zipalign + apksigner），
      # 签完把 -unsigned 从文件名里去掉；没配 Secrets 时脚本会跳过并保持未签名。
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: node scripts/sign-android-apk.mjs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jizhang-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
          if-no-files-found: error

      # 只把已签名的 APK 传到 GitHub Release（这里快，8MB 二十秒左右）。
      #
      # **不要再往 Gitee 传 APK 本体**：实测 Gitee 附件上传接口只有 10~50 KB/s
      # （香港传 30~50KB/s，Actions 传 10~24KB/s，而同一台机器传 GitHub 有 876KB/s），
      # 一个包要传 2~8 分钟，还经常超时重试。慢的是 Gitee 的附件服务，不是跨境。
      #
      # 分发链路改成「香港中转机」：香港机器定时跑 scripts/mirror-apk-to-hk.mjs，
      # 从本 Release 下载 APK 挂到自己的 nginx（:9443，上行 43MB/s），
      # 只把几百字节的 latest.json 推到 Gitee。App 端清单地址不变，
      # 但清单里的 APK 直链指向中转机。
      # 详见 README「更新链路」一节。
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.pkg.outputs.version }}-${{ github.run_number }}
          name: Android v${{ steps.pkg.outputs.version }} (#${{ github.run_number }})
          body: |
            未签名的 APK 无法安装，请下载本页附件中的 APK（已用 upload keystore 签名）。

            - 现代手机（arm64）选 `app-arm64-release.apk`
            - 老设备（armeabi-v7a）选 `app-arm-release.apk`

            > 本页是构建产物源，香港中转机会自动拉取并同步给 App 内的「软件更新」。
            > 直接在这里下载也可以，只是国内可能要翻墙。

            首次安装需在系统设置里允许「安装未知来源应用」。升级安装必须用同一签名的包，
            否则会提示「应用未安装」，需先卸载旧版本（会清掉本地账目，建议先导出备份）。
          generate_release_notes: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*-release.apk
