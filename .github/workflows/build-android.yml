name: Build Android App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          
      - name: Install dependencies
        run: npm ci
        
      - name: Initialize Android project
        run: npm run tauri android init
        
      - name: Build APK (Unsigned)
        run: npm run tauri android build

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          # 指向 Tauri 生成 universal apk 的目录
          releaseDirectory: src-tauri/gen/android/app/build/outputs/apk/universal/release
          # 调用你在 GitHub Settings 中配置的 Secrets
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          # 必须与上方 Setup Android SDK 中的 build-tools 版本保持一致
          BUILD_TOOLS_VERSION: "35.0.0" 

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android Build ${{ github.run_number }}
          generate_release_notes: true
          # 直接上传经过签名插件处理后的正式版 APK
          files: ${{steps.sign_app.outputs.signedReleaseFile}}