[package]
name = "ai-ledger"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 用于发起 HTTP 请求调用大模型 API（json 即可，无需 multipart；语音转写已下线）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 异步运行时
tokio = { version = "1.0", features = ["macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 软件更新要用系统浏览器打开 APK 下载地址。
# 必须用这个插件而不是自己 spawn 进程：Android 沙箱里没有可执行的浏览器进程，
# 只能通过系统 Intent 打开 URL，opener 正是这么做的（官方维护）。
# 注意不要用 shell 插件的 open：它在 Android 上会报 Scoped shell IO error。
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"   # 体积优先：安装包从 30MB 降到个位数
panic = "abort"
strip = true
