[package]
name = "ai-ledger"
# 版本号的唯一来源是 package.json —— tauri.conf.json 的 version 直接指向它，
# 这里只是 Rust crate 自身的版本（不进 APK 的 versionName），跟着改只是为了别让人误以为有两套。
version = "0.1.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 用于发起 HTTP 请求调用大模型 API（json 即可，无需 multipart；语音转写已下线）
#
# TLS 后端：**必须用系统信任库**（`rustls-tls-native-roots`），不要用默认的 rustls。
#
# 默认的 `rustls-tls` 走 `webpki-roots` —— 那是编译期静态打包的根证书列表，
# 只认写进去的那批根 CA，**不跟随系统更新**。Let's Encrypt 自 2025 年起启用了新的
# 中间证书体系（`YR2` → `Root YR` → `ISRG Root X1`），一旦 webpki-roots 的版本
# 还没收录这条链，握手就会直接失败，表现是 `error sending request`：
# 实测同一地址**系统浏览器能打开、App 里连不上**，极难归因。
# 换 native-roots 后走 Android / iOS / Windows 各自的系统信任存储，与浏览器完全一致。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# 异步运行时
tokio = { version = "1.0", features = ["macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 软件更新要用系统浏览器打开 APK 下载地址。
# 必须用这个插件而不是自己 spawn 进程：Android 沙箱里没有可执行的浏览器进程，
# 只能通过系统 Intent 打开 URL，opener 正是这么做的（官方维护）。
# 注意不要用 shell 插件的 open：它在 Android 上会报 Scoped shell IO error。
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"   # 体积优先：安装包从 30MB 降到个位数
panic = "abort"
strip = true
